<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Desplegable</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #6b6b93; }
        .top-bar { background-color: #a3d9cf; height: 120px; }
        .menu-btn {
            background-color: red;
            color: yellow;
            border: none;
            font-size: 24px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            margin: 10px;
        }
        .login-box {
            background-color: #00d2ff;
            width: 280px;
            padding: 15px;
            margin-left: 10px;
            display: none; /* Inicia oculto */
            box-sizing: border-box;
            text-align: center;
        }
        .login-box label { display: block; margin-bottom: 5px; color: #333; }
        .login-box input { width: 90%; padding: 5px; margin-bottom: 10px; }
        .login-box button { background-color: #e0e0e0; border: 1px solid #aaa; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <!-- Botón desplegable -->
    <button class="menu-btn" onclick="toggleForm()">☰</button>

    <!-- Formulario de ingreso -->
    <div class="login-box" id="formulario">
        <label>Correo Electrónico:</label>
        <input type="text">
        <label>Contraseña:</label>
        <input type="password"><br>
        <button>Iniciar Sesión</button>
    </div>

    <p style="margin: 20px;"><a href="index.html" style="color: white;">Regresar al Índice</a></p>

    <script>
        function toggleForm() {
            let form = document.getElementById("formulario");
            if (form.style.display === "none" || form.style.display === "") {
                form.style.display = "block";
            } else {
                form.style.display = "none";
            }
        }
    </script>
</body>
</html>
