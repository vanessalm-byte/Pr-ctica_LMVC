<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suma de Positivos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #eef2f3; }
        .card { background: white; padding: 20px; max-width: 400px; margin: auto; border-radius: 8px; }
        button { background: #2980b9; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Suma de Números Positivos</h2>
        <p>Haz clic para ingresar números. El programa se detendrá al ingresar 0 o un número negativo.</p>
        <button onclick="calcularSuma()">Iniciar Suma</button>
        <h3>Resultado: <span id="resultado">0</span></h3>
        <a href="index.html">Regresar al Índice</a>
    </div>

    <script>
        function calcularSuma() {
            let suma = 0;
            let numero = parseFloat(prompt("Ingresa un número positivo (0 o negativo para salir):"));

            while (numero > 0) {
                suma += numero;
                numero = parseFloat(prompt("Ingresa otro número positivo (0 o negativo para terminar):"));
            }

            document.getElementById("resultado").textContent = suma;
            alert("La suma total es: " + suma);
        }
    </script>
</body>
</html>
